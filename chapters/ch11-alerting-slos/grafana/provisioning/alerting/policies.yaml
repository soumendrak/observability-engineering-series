# policies.yaml — Chapter 11: Alerting & SLOs
#
# Alert routing: determines which contact point receives each alert
# based on labels (severity).
#
# Local dev: all alerts go to the dev-null email contact point.
# Production: follow "To enable production routing" in this chapter's README.md
# (uncommenting the routes below is not enough on its own).

apiVersion: 1
policies:
  - orgId: 1
    receiver: dev-null
    # ── Production routing (see README; also change the root receiver above
    #    from dev-null to slack-engineering) ──
