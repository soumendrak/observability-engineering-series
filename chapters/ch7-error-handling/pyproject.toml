[project]
name = "ch7-error-handling"
version = "0.1.0"
description = "Error Handling & Semantic Instrumentation: making every failure visible in your observability stack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-exporter-prometheus>=0.66b2",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=logging_setup --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
files = ["logging_setup.py", "tests"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]
