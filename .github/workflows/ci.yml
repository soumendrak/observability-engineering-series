name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-chapters:
    runs-on: ubuntu-latest
    outputs:
      chapters: ${{ steps.list.outputs.chapters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "chapters=$(find chapters -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  python:
    needs: list-chapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJSON(needs.list-chapters.outputs.chapters) }}
    defaults:
      run:
        working-directory: ${{ matrix.chapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - name: compile and import every module
        run: |
          uv run python -m compileall -q -x '/\.venv/' .
          for f in $(git ls-files '*.py' ':!:tests/*'); do
            echo "import ${f%.py}"
            uv run python -W error::DeprecationWarning -c "import importlib, sys; sys.path.insert(0, '.'); importlib.import_module(sys.argv[1])" "${f%.py}"
          done
      - name: mypy
        run: |
          if grep -q '^\[tool.mypy\]' pyproject.toml; then
            uv run mypy
          else
            echo "no mypy config in this chapter"
          fi
      - name: pytest
        run: |
          if [ -d tests ]; then
            uv run pytest -W error
          else
            echo "no tests in this chapter"
          fi

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          find chapters -name docker-compose.yml | sort | while read -r f; do
            echo "== $f"
            docker compose -f "$f" config --quiet
            if docker compose -f "$f" config --images | grep -E ':latest$|^[^:]+$'; then
              echo "unpinned image in $f"
              exit 1
            fi
          done

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check config, check rules, test rules
        run: |
          find chapters -name prometheus.yml | sort | while read -r f; do
            dir=$(dirname "$f")
            image=$(docker compose -f "$dir/docker-compose.yml" config --images | grep '^prom/prometheus:')
            echo "== $f with $image"
            docker run --rm -v "$PWD/$dir:/w:ro" -w /w --entrypoint promtool "$image" check config --syntax-only prometheus.yml
            if [ -f "$dir/test_alerts.yaml" ]; then
              docker run --rm -v "$PWD/$dir:/w:ro" -w /w --entrypoint promtool "$image" check rules prometheus-alert-rules.yml
              docker run --rm -v "$PWD/$dir:/w:ro" -w /w --entrypoint promtool "$image" test rules test_alerts.yaml
            fi
          done

  grafana-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chapters/ch11-alerting-slos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: boot ch11, send traffic, assert every Grafana alert rule has health ok
        run: |
          docker compose up -d --wait
          nohup make run-order > order.log 2>&1 &
          nohup make run-gateway > gateway.log 2>&1 &
          until curl -sf -o /dev/null localhost:8000/health; do sleep 2; done
          until curl -s 'localhost:9090/api/v1/query?query=otel_gateway_requests_total' | jq -e '.data.result | length > 0' > /dev/null; do
            curl -s -o /dev/null localhost:8000/checkout
            curl -s -o /dev/null localhost:8000/products/widget
            sleep 2
          done
          t0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expected=$(grep -c '^      - uid:' grafana/provisioning/alerting/alerts.yaml)
          echo "metrics in Prometheus at $t0, expecting $expected rules"
          for _ in $(seq 60); do
            curl -s -o /dev/null localhost:8000/checkout
            rules=$(curl -s -u admin:admin localhost:3000/api/prometheus/grafana/api/v1/rules)
            if echo "$rules" | jq -e --arg t0 "$t0" --argjson n "$expected" '[.data.groups[].rules[]] | length == $n and all(.lastEvaluation > $t0)' > /dev/null; then
              break
            fi
            sleep 5
          done
          echo "$rules" | jq -r '.data.groups[].rules[] | [.name, .state, .health, .lastEvaluation, (.lastError // "")] | @tsv'
          echo "$rules" | jq -e --arg t0 "$t0" --argjson n "$expected" '[.data.groups[].rules[]] | length == $n and all(.lastEvaluation > $t0 and .health == "ok")' > /dev/null
      - name: logs
        if: failure()
        run: |
          docker compose logs
          cat order.log gateway.log

  otelcol-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          find chapters -name otel-collector-config.yaml | sort | while read -r f; do
            dir=$(dirname "$f")
            image=$(docker compose -f "$dir/docker-compose.yml" config --images | grep '^otel/opentelemetry-collector-contrib:')
            echo "== $f with $image"
            docker run --rm -v "$PWD/$f:/etc/otelcol/config.yaml:ro" "$image" validate --config /etc/otelcol/config.yaml
          done
